<!doctype html>

<style>
html,body{margin:0;height:100%;background:#000;color:#eee;font:13px system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0}
#wrap{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden}
#wrap.zoomed{overflow:auto}
#wrap.pan{touch-action:pan-x pan-y}
#wrap.pan canvas{pointer-events:none}
#screen{position:absolute;left:0;top:0;width:100%;height:100%}
#bar{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;background:rgba(0,0,0,.65);display:flex;gap:8px;align-items:center;pointer-events:none}
#dot{width:9px;height:9px;border-radius:50%;background:#777;flex:none}
#dot.live{background:#2ecc71;animation:p 1.2s infinite}#dot.work{background:#f1c40f;animation:p .7s infinite}
@keyframes p{50%{opacity:.35}}
#msg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.mini #bar{padding:2px 5px;font-size:10px}
#off{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:16px;color:#aaa}
#warn{display:none;background:#5c4400;color:#ffe9a6;padding:6px 10px;font-size:12.5px}
body.ctl.busy #warn{display:block}
#mode{position:absolute;top:8px;right:8px;z-index:5;background:#26262b;color:#fff;border:1px solid #444;border-radius:16px;padding:6px 12px;font:600 13px system-ui;display:none}
body.standalone:not(.mini) #mode{display:block}
#tools,#kbd{display:none;background:#141418;border-top:1px solid #2a2a30}
body.ctl #tools{display:flex}
body.ctl.kbdopen #kbd{display:flex}
#tools{gap:6px;padding:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex:none}
#tools button,#kbd button{flex:none;min-width:40px;height:36px;padding:0 10px;border-radius:9px;border:1px solid #33333a;background:#24242a;color:#f2f2f2;font:600 13px system-ui}
#tools button.on{background:#f5c400;color:#111;border-color:#f5c400}
#kbd{gap:6px;padding:6px;align-items:center;flex:none}
#txt{flex:1;min-width:0;height:36px;border-radius:9px;border:1px solid #44444c;background:#0d0d10;color:#fff;padding:0 10px;font:15px system-ui}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(30,30,34,.95);color:#fff;padding:7px 12px;border-radius:10px;display:none;z-index:9;font-size:12.5px;max-width:90%}
</style>

<body>
<div id="warn">⚠ Агент сейчас работает на этом экране — ваши клики и ввод могут ему помешать.</div>
<div id="stage"><div id="wrap"><div id="screen"></div></div><div id="off"></div><div id="toast"></div>
  <div id="bar"><div id="dot"></div><div id="msg">Подключение…</div></div>
  <button id="mode"></button></div>
<div id="kbd"><input id="txt" type="text" placeholder="Текст для ввода (Enter — ввести)" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="send">Ввести</button><button id="sendEnter">Ввести ⏎</button></div>
<div id="tools">
  <button id="k-kbd" title="Клавиатура">⌨</button>
  <button data-k="Escape">Esc</button><button data-k="Tab">Tab</button>
  <button data-mod="Control">Ctrl</button><button data-mod="Alt">Alt</button><button data-mod="Shift">Shift</button>
  <button data-k="Return">Enter</button><button data-k="BackSpace">⌫</button>
  <button data-k="Left">←</button><button data-k="Up">↑</button><button data-k="Down">↓</button><button data-k="Right">→</button>
  <button data-combo="c">Ctrl+C</button><button data-combo="v">Ctrl+V</button><button data-combo="z">Ctrl+Z</button>
  <button data-k="Super_L">Super</button><button data-k="Delete">Del</button><button data-k="Home">Home</button><button data-k="End">End</button>
  <button data-k="Page_Up">PgUp</button><button data-k="Page_Down">PgDn</button>
  <button id="k-zoom" title="Увеличение">🔍 1×</button><button id="k-pan" title="Двигать увеличенный экран">✋</button>
</div>
<script type="module" crossorigin="use-credentials">
import RFB from './core/rfb.js';
import KeyTable from './core/input/keysym.js';
const q=new URLSearchParams(location.search);
const MINI=!!q.get('mini'), CTL=q.get('mode')==='control' && !MINI;
const $=id=>document.getElementById(id);
if(MINI) document.body.classList.add('mini');
if(CTL){ document.body.classList.add('ctl'); $('vp').setAttribute('content','width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'); }
if(!q.get('app')) document.body.classList.add('standalone');
$('mode').textContent = CTL ? '👁 Смотреть' : '🖱 Управлять';
$('mode').onclick=()=>{ q.set('mode', CTL?'view':'control'); location.search=q.toString(); };
let rfb=null, connected=false, activity='';
function toast(t){ const e=$('toast'); e.textContent=t; e.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>{e.style.display='none';},2600); }
function status(){
  $('dot').className = connected ? (activity?'dot work':'dot live') : 'dot';
  document.body.classList.toggle('busy', !!activity);
  $('msg').textContent = !connected ? 'Экран не запущен. Он включится при первом действии агента на компьютере/в браузере.'
    : CTL ? (activity ? '🖱 Управление · ▶ '+activity : '🖱 Управление: тап — клик, долгое нажатие — правый клик, 2 пальца — прокрутка')
    : (activity ? '▶ '+activity : 'Агент свободен — экран в реальном времени');
}
function connect(){
  const base=location.pathname.replace(/[^/]*$/,'');
  const url=(location.protocol==='https:'?'wss://':'ws://')+location.host+base+(CTL?'control/websockify':'websockify');
  try{ rfb=new RFB($('screen'),url,{shared:true}); }catch(e){ setTimeout(connect,5000); return; }
  rfb.viewOnly=!CTL; rfb.scaleViewport=true; rfb.resizeSession=false; rfb.background='#000';
  rfb.focusOnClick=CTL; rfb.showDotCursor=CTL;
  rfb.addEventListener('connect',()=>{connected=true;$('off').style.display='none';status();});
  rfb.addEventListener('disconnect',()=>{connected=false;status();
    // локальный режим MURF: экран бота мог быть не запущен — один раз просим его поднять (на сервере это 404)
    if(!window.__deskStart){ window.__deskStart=1; fetch('/phone/api/screen/start',{method:'POST',credentials:'same-origin',headers:{'X-Agent-App':'1'}}).catch(()=>{}); }
    setTimeout(connect,4000);});
}
async function poll(){
  try{ const r=await fetch('/api/sessions',{credentials:'same-origin'}); if(r.ok){ const d=await r.json(); const s=(d.sessions||d||[]);
    const act=s.filter(x=>x.active_stream_id).sort((a,b)=>(b.updated_at||0)-(a.updated_at||0))[0]; activity=act?(act.title||'агент работает'):''; } }catch(e){}
  status(); setTimeout(poll,3000);
}
// ---- управление: клавиши
const CODES={Escape:'Escape',Tab:'Tab',Return:'Enter',BackSpace:'Backspace',Left:'ArrowLeft',Up:'ArrowUp',Down:'ArrowDown',Right:'ArrowRight',
  Super_L:'MetaLeft',Delete:'Delete',Home:'Home',End:'End',Page_Up:'PageUp',Page_Down:'PageDown',Control:'ControlLeft',Alt:'AltLeft',Shift:'ShiftLeft'};
const MODSYM={Control:KeyTable.XK_Control_L,Alt:KeyTable.XK_Alt_L,Shift:KeyTable.XK_Shift_L};
const sticky=new Set();
function ready(){ if(!rfb||!connected){ toast('Нет соединения с экраном'); return false; } return true; }
function press(sym, code){
  if(!ready()) return;
  sticky.forEach(m=>rfb.sendKey(MODSYM[m], CODES[m], true));
  rfb.sendKey(sym, code, true); rfb.sendKey(sym, code, false);
  sticky.forEach(m=>rfb.sendKey(MODSYM[m], CODES[m], false));
  sticky.clear(); document.querySelectorAll('[data-mod]').forEach(b=>b.classList.remove('on'));
}
document.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click',()=>{ const k=b.dataset.k; press(KeyTable['XK_'+k], CODES[k]); }));
document.querySelectorAll('[data-mod]').forEach(b=>b.addEventListener('click',()=>{ const m=b.dataset.mod; if(sticky.has(m)){sticky.delete(m);b.classList.remove('on');} else {sticky.add(m);b.classList.add('on');} }));
document.querySelectorAll('[data-combo]').forEach(b=>b.addEventListener('click',()=>{ const c=b.dataset.combo; sticky.add('Control'); press(KeyTable['XK_'+c], 'Key'+c.toUpperCase()); }));
// ---- ввод текста: xdotool на сервере (кириллица), запасной путь — буфер обмена + Ctrl+V
async function sendText(enter){
  const t=$('txt').value; if(!t && !enter) return;
  if(!ready()) return;
  try{
    const r=await fetch('/phone/api/screen/type',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Agent-App':'1'},body:JSON.stringify({text:t,enter:!!enter})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok || !d.ok) throw new Error(d.error||('HTTP '+r.status));
  }catch(e){
    if(t){ rfb.clipboardPasteFrom(t); sticky.add('Control'); press(KeyTable.XK_v,'KeyV'); }
    if(enter) press(KeyTable.XK_Return,'Enter');
    toast('Ввод через сервер недоступен ('+e.message+') — вставлено через буфер обмена');
  }
  $('txt').value='';
}
$('send').onclick=()=>sendText(false); $('sendEnter').onclick=()=>sendText(true);
$('txt').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); sendText(false); } });
$('k-kbd').onclick=()=>{ const open=!document.body.classList.contains('kbdopen'); document.body.classList.toggle('kbdopen',open); $('k-kbd').classList.toggle('on',open); if(open) setTimeout(()=>$('txt').focus(),50); else $('txt').blur(); };
// ---- увеличение и перемещение (для точных кликов)
let zoom=1;
function applyZoom(){
  $('screen').style.width=(zoom*100)+'%'; $('screen').style.height=(zoom*100)+'%';
  $('wrap').classList.toggle('zoomed',zoom>1); $('k-zoom').textContent='🔍 '+zoom+'×';
  if(zoom===1){ $('wrap').classList.remove('pan'); $('k-pan').classList.remove('on'); }
}
$('k-zoom').onclick=()=>{ const w=$('wrap'); const cx=(w.scrollLeft+w.clientWidth/2)/(w.scrollWidth||1), cy=(w.scrollTop+w.clientHeight/2)/(w.scrollHeight||1);
  zoom = zoom>=3 ? 1 : zoom+1; applyZoom();
  requestAnimationFrame(()=>{ w.scrollLeft=cx*w.scrollWidth-w.clientWidth/2; w.scrollTop=cy*w.scrollHeight-w.clientHeight/2; }); };
$('k-pan').onclick=()=>{ if(zoom===1){ toast('Сначала увеличьте экран (🔍)'); return; } const on=!$('wrap').classList.contains('pan'); $('wrap').classList.toggle('pan',on); $('k-pan').classList.toggle('on',on); toast(on?'Перемещение: двигайте экран пальцем':'Перемещение выключено — касания снова управляют'); };
window.murf={mode:CTL?'control':'view', zoom:()=>zoom};
status(); connect(); poll();
</script></body></html>
