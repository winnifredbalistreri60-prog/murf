# MURF: управление экраном агента (полный ввод). Тот же вход WebUI, что и /screen/; только с нашего Origin.
location = /screen/control/websockify {
    auth_request /_screen_auth;
    if ($http_origin !~ "^https://your-server\.example$") { return 403; }
    proxy_pass http://127.0.0.1:6082/websockify;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $agent_webui_conn;
    proxy_set_header Host 127.0.0.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
