# Example nginx site for MURF. Replace your-server.example, certificate paths and ports.
# Everything except nginx listens on 127.0.0.1 on the same host.
#   hermes-webui        127.0.0.1:8787   (HERMES_WEBUI_HOST/PORT)
#   Hermes API server   127.0.0.1:8642   (API_SERVER_ENABLED=true, API_SERVER_KEY=...)
#   screen (view only)  127.0.0.1:6081   websockify --web <agent-screen dir> --unix-target=~/.cache/agent-screen/view.sock
#   screen (control)    127.0.0.1:6082   websockify --unix-target=~/.hermes/bot-desktop/rfb.sock
#   phone relay         127.0.0.1:8790   server/phone-relay/phone_relay.py

map $http_upgrade $murf_conn { default upgrade; '' close; }

server {
    listen 443 ssl http2;
    server_name your-server.example;
    ssl_certificate     /etc/letsencrypt/live/your-server.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-server.example/privkey.pem;
    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;

    # WebUI session check (200 when the cookie is valid, 401 otherwise)
    location = /_screen_auth {
        internal;
        proxy_pass http://127.0.0.1:8787/api/profiles;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    # Agent screen page + view-only websocket
    location /screen/ {
        auth_request /_screen_auth;
        error_page 401 = @screen_login;
        proxy_pass http://127.0.0.1:6081/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $murf_conn;
        proxy_set_header Host 127.0.0.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        add_header Cache-Control "no-store" always;
    }
    location @screen_login { return 302 /; }

    # Full control (input) — same login, only from our own Origin
    location = /screen/control/websockify {
        auth_request /_screen_auth;
        if ($http_origin !~ "^https://your-server\.example$") { return 403; }
        proxy_pass http://127.0.0.1:6082/websockify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $murf_conn;
        proxy_set_header Host 127.0.0.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Phone bridge: app API behind the WebUI session, one-time file tokens open
    location /phone/api/ {
        auth_request /_screen_auth;
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
    }
    location ~ ^/phone/(up|dl)/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        client_max_body_size 50m;
    }

    # OpenAI-compatible agent API (Bearer API_SERVER_KEY)
    location /agent/ {
        proxy_pass http://127.0.0.1:8642/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # hermes-webui (REST + SSE)
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $murf_conn;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
