# MURF local mode: nginx только на 127.0.0.1:@PORT@ (копия серверной схемы без TLS)
user root;
worker_processes 1;
pid run.pid;
error_log logs-error.log warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path tmp-body; proxy_temp_path tmp-proxy;
    fastcgi_temp_path tmp-fcgi; uwsgi_temp_path tmp-uwsgi; scgi_temp_path tmp-scgi;
    sendfile on;
    map $http_upgrade $murf_conn { default upgrade; '' close; }
    server {
        listen 127.0.0.1:@PORT@;
        server_name localhost 127.0.0.1;
        client_max_body_size 50m;
        add_header X-Content-Type-Options nosniff always;

        location = /_screen_auth {
            internal;
            proxy_pass http://127.0.0.1:8787/api/profiles;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header Cookie $http_cookie;
        }
        # состояние среды без авторизации (только служебные флаги, без секретов)
        location = /murf/health { proxy_pass http://127.0.0.1:18083/murf/health; }

        # страница экрана: статика напрямую из /root/agent-screen (раньше её отдавал websockify --web —
        # отдельный процесс на каждый из ~40 модулей noVNC; на Android это медленно и попадает под «phantom process killer»)
        location /screen/ {
            auth_request /_screen_auth;
            error_page 401 = @screen_login;
            alias /root/agent-screen/;
            index index.html;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
        }
        # библиотека noVNC (публичный код, без данных) — без проверки входа, с кэшем WebView
        location ~ ^/screen/((core|vendor)/[A-Za-z0-9_./-]+\.js)$ {
            alias /root/agent-screen/$1;
            add_header Cache-Control "private, max-age=86400" always;
            add_header X-Content-Type-Options nosniff always;
        }
        location = /screen/websockify {
            auth_request /_screen_auth;
            proxy_pass http://127.0.0.1:18081/websockify;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $murf_conn;
            proxy_set_header Host 127.0.0.1;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
        location @screen_login { return 302 /; }
        location = /screen/control/websockify {
            auth_request /_screen_auth;
            if ($http_origin !~ "^http://(127\.0\.0\.1|localhost):@PORT@$") { return 403; }
            proxy_pass http://127.0.0.1:18082/websockify;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $murf_conn;
            proxy_set_header Host 127.0.0.1;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
        # ввод текста в экран (как /phone/api/screen/type на сервере)
        location /phone/api/ {
            auth_request /_screen_auth;
            proxy_pass http://127.0.0.1:18083;
            proxy_set_header Host 127.0.0.1;
            add_header Cache-Control "no-store" always;
        }
        location /phone/ { return 404; }
        # OpenAI-совместимый API агента (как /agent/v1 на VDS), ключ — Bearer API_SERVER_KEY
        location /agent/ {
            proxy_pass http://127.0.0.1:8642/;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
        location / {
            proxy_pass http://127.0.0.1:8787;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $murf_conn;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
